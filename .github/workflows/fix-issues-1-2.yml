name: Resolve SignalWorks Studio issues 1 and 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply tested source patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, lzma
          from pathlib import Path
          payload = ''''''
          Path('/tmp/issues.patch.xz').write_bytes(base64.b64decode(payload))
          Path('/tmp/issues.patch').write_bytes(lzma.decompress(Path('/tmp/issues.patch.xz').read_bytes()))
          PY
          git apply --check /tmp/issues.patch
          git apply /tmp/issues.patch

      - name: Update version and preset documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          history = Path('VERSION_HISTORY.md')
          text = history.read_text(encoding='utf-8')
          heading = '## GitHub issue hotfix — 2026-09-15'
          if heading not in text:
              block = '''## GitHub issue hotfix — 2026-09-15

Resolved GitHub Issues **#1 Graphic looks bug** and **#2 Time format plotting issue** on the V4.4.5 production line.

- Added explicit `dd.MM.yyyy HH:mm:ss` and fractional-second timestamp parsing.
- Limited legends to a maximum of three rows by expanding columns horizontally.
- Preserved Plotly zoom/pan, drag mode and trace visibility per tab within the browser session.
- PNG, Wide PDF, A4 PDF and Word exports now inherit saved view ranges and trace visibility.
- Added per-signal line style: Auto, Solid, Dash, Dot, Dash-dot and Long dash.
- Lightened Dark mode surfaces and controls for better readability.
- Added built-in DOCX export fallback when `python-docx` is unavailable.
- Preserved backward compatibility with V1 presets; new presets may include `line_style`.

---

'''
              first_nl = text.find('\n')
              text = text[:first_nl+1] + '\n' + block + text[first_nl+1:]
              history.write_text(text, encoding='utf-8')

          preset = Path('PRESET_FORMAT_V1.md')
          text = preset.read_text(encoding='utf-8')
          if '## Signal line style (optional)' not in text:
              text = text.rstrip() + '''


## Signal line style (optional)

Signal entries may include an optional `line_style` field. Supported values are `auto`, `solid`, `dash`, `dot`, `dashdot`, and `longdash`. Older V1 presets without this field remain fully compatible; `auto` preserves the original Primary/Secondary line-style behavior.
'''
              preset.write_text(text, encoding='utf-8')
          PY

      - name: Compile and run focused validation
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python -m py_compile SignalWorks_Studio_webserv_v4_4_5.py
          python - <<'PY'
          import importlib.util, io, math, sys, zipfile
          import pandas as pd
          import matplotlib.pyplot as plt

          path='SignalWorks_Studio_webserv_v4_4_5.py'
          spec=importlib.util.spec_from_file_location('signalworks_validation', path)
          mod=importlib.util.module_from_spec(spec)
          sys.modules['signalworks_validation']=mod
          spec.loader.exec_module(mod)

          df=pd.DataFrame({'Timestamp':['31.08.2026 23:59:59','01.09.2026 00:00:01','01.09.2026 00:00:02.500']})
          conv,count,_=mod._best_datetime_conversion(df,'Timestamp')
          assert count == 3
          assert [x.month for x in conv] == [8,9,9]
          assert pd.Series(conv).is_monotonic_increasing

          for n in (1,3,4,7,10,16):
              cols=mod.compact_legend_ncol(n)
              assert math.ceil(n/cols) <= 3

          fig=plt.figure(figsize=(2,1))
          plt.plot([0,1],[0,1])
          buf=io.BytesIO()
          fig.savefig(buf, format='png')
          plt.close(fig)
          docx_bytes=mod._build_builtin_docx([buf.getvalue()])
          with zipfile.ZipFile(io.BytesIO(docx_bytes)) as zf:
              assert zf.testzip() is None
              assert 'word/document.xml' in zf.namelist()

          source=open(path, encoding='utf-8').read()
          assert '<title>{esc(APP_TITLE)} — {esc(APP_TAGLINE)}</title>' in source
          assert 'signalworks_studio_theme_session_mode' in source
          assert 'line_style_assignments' in source
          assert 'exportViewStates' in source
          print('Focused validation PASS')
          PY
          git diff --check

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-issues-1-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix GitHub issues #1 and #2'
          git push
