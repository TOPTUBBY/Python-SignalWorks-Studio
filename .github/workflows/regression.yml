name: SignalWorks regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m py_compile SignalWorks_Studio_webserv_v4_4_5.py signalworks_studio_launcher.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_view_state.cjs
      - name: Install browser regression dependencies
        run: |
          npm install --prefix /tmp/signalworks-browser --no-save playwright
          /tmp/signalworks-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser regression
        env:
          NODE_PATH: /tmp/signalworks-browser/node_modules
        run: node tests/test_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-screenshots
          path: tests/browser-artifacts/
